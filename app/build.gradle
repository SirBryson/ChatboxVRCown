plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.mikepenz.aboutlibraries.plugin'
}

def keystorePropertiesFile = rootProject.file("keystore.properties");
def keystoreProperties = new Properties()

def punctuationModelVersion = "sherpa-onnx-online-punct-en-2024-08-06"
def punctuationArchive = layout.buildDirectory.file("downloads/${punctuationModelVersion}.tar.bz2")
def punctuationAssetsDir = layout.buildDirectory.dir("generated/punctuationAssets")

tasks.register("downloadPunctuationModel") {
    outputs.file(punctuationArchive)
    doLast {
        def destination = punctuationArchive.get().asFile
        if (!destination.exists()) {
            destination.parentFile.mkdirs()
            new URL(
                "https://github.com/k2-fsa/sherpa-onnx/releases/download/" +
                    "punctuation-models/${punctuationModelVersion}.tar.bz2"
            ).withInputStream { input ->
                destination.withOutputStream { output -> output << input }
            }
        }
    }
}

tasks.register("preparePunctuationAssets", Copy) {
    dependsOn("downloadPunctuationModel")
    from({ tarTree(resources.bzip2(punctuationArchive.get().asFile)) }) {
        include "${punctuationModelVersion}/model.int8.onnx"
        include "${punctuationModelVersion}/bpe.vocab"
        eachFile { file ->
            file.path = "punctuation/${file.name}"
        }
        includeEmptyDirs = false
    }
    into(punctuationAssetsDir)
}

if (keystorePropertiesFile.exists()){
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    signingConfigs {
        debug {
            if (keystorePropertiesFile.exists()){
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    namespace 'com.scrapw.chatbox'
    compileSdk 34

    defaultConfig {
        applicationId "com.scrapw.chatbox"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "v1.0.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.debug
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
        freeCompilerArgs += [
                '-opt-in=androidx.compose.material3.ExperimentalMaterial3Api'
        ]
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    sourceSets {
        main.assets.srcDir(punctuationAssetsDir)
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.9'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

preBuild.dependsOn("preparePunctuationAssets")

aboutLibraries {
    configPath = "config"
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation platform('androidx.compose:compose-bom:2024.01.00')
    implementation 'androidx.compose.foundation:foundation:1.7.0-beta04'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'

    implementation "androidx.compose.material:material-icons-extended:1.6.1"
    implementation "androidx.datastore:datastore-preferences:1.0.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0"
    implementation 'androidx.navigation:navigation-runtime-ktx:2.7.7'
    implementation 'androidx.navigation:navigation-compose:2.7.7'

    implementation 'com.illposed.osc:javaosc-core:0.7'
    implementation 'com.github.k2-fsa.sherpa-onnx:sherpa-onnx:v1.13.5'

//    implementation 'com.github.alorma:compose-settings-ui-m3:1.0.3'
    implementation 'com.github.alorma:compose-settings-storage-base:1.0.3'
    implementation 'com.github.alorma:compose-settings-storage-datastore:0.27.0'

    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"

    implementation "com.mikepenz:aboutlibraries-core:${latestAboutLibsRelease}"
    implementation "com.mikepenz:aboutlibraries-compose-m3:${latestAboutLibsRelease}"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.01.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
